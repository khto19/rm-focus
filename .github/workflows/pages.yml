name: Deploy RM Focus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare daily fixture API
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Refresh Real Madrid fixtures
        run: python scripts/sync-fixtures.py
      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: outputs
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

